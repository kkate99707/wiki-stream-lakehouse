[project]
name = "wiki-stream-lakehouse"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F - базовые ошибки, I - сортировка импортов, B - частые баги,
# UP - современный синтаксис Python, SIM - упрощения кода
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
